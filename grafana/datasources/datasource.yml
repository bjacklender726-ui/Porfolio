apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: ${GRAFANA_DB_HOST:postgres}:5432
    database: ${GRAFANA_DB_NAME:portfolio_db}
    user: ${GRAFANA_DB_USER:admin}
    secureJsonData:
      password: ${GRAFANA_DB_PASS:admin123}
    jsonData:
      sslmode: ${GRAFANA_DB_SSLMODE:disable}
      postgresVersion: 1600
      timescaledb: false
